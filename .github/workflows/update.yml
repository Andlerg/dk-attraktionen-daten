name: Daten aktualisieren

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: osmium-tool installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool

      - name: Auszug von Geofabrik laden
        run: |
          curl -fsSL --retry 4 --retry-delay 30 -A "dk-attraktionen-daten (GitHub Actions)" -o denmark.osm.pbf https://download.geofabrik.de/europe/denmark-latest.osm.pbf
          ls -l denmark.osm.pbf

      - name: Attraktionen herausfiltern
        run: |
          osmium tags-filter denmark.osm.pbf nwr/tourism=museum,theme_park,zoo,aquarium,attraction nwr/leisure=water_park nwr/historic=castle,fort,manor -o filtered.osm.pbf --overwrite
          osmium export filtered.osm.pbf -f geojson --add-unique-id=type_id -o filtered.geojson --overwrite
          ls -l filtered.geojson

      - name: Karten-Datei bauen
        run: python3 scripts/build_attractions.py filtered.geojson data/attractions.json --min-items 300

      - name: Aenderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/attractions.json
          git diff --cached --quiet || git commit -m "Daten aktualisiert $(date -u +%F)"
          git push
